name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Build Release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore_path="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            chmod 600 "$keystore_path"
            echo "path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            export MAUZTUBE_KEYSTORE="$KEYSTORE_PATH"
            export MAUZTUBE_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export MAUZTUBE_KEY_ALIAS="$KEY_ALIAS_VAL"
            export MAUZTUBE_KEY_PASSWORD="$KEY_PASS"
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleRelease -PdebugSign --stacktrace --no-daemon
          fi

      - name: Clean up signing keystore
        if: always() && steps.keystore.outputs.path != ''
        run: rm -f "${{ steps.keystore.outputs.path }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish Tag Release
    needs: [debug, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: MauzTube-release-${{ github.sha }}
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "$TAG" --generate-notes
          fi
